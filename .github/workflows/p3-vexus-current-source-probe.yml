name: P3 Vexus current-source probe

on:
  push:
    branches:
      - integration/p3-vexus-native-abi-probe

permissions:
  contents: read

jobs:
  source-build-probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact tracking source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TRACKING=1cf353b4f5c18afdfb4b3bc59e9fc966bc26538f
          ACTUAL="$(git ls-remote origin refs/heads/integration/upstream-tracking-rebaseline-r1 | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED_TRACKING"
          git cat-file -e "$EXPECTED_TRACKING^{commit}"
          printf 'TRACKING=%s\n' "$EXPECTED_TRACKING" | tee /tmp/p3-source.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Install pinned native build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-12 g++-12 binutils
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          npm install --prefix /tmp/napi-cli --ignore-scripts --no-audit --no-fund @napi-rs/cli@2.18.4
          {
            rustc --version
            cargo --version
            node --version
            /tmp/napi-cli/node_modules/.bin/napi --version
            gcc-12 --version | head -n 1
            ldd --version | head -n 1
          } | tee /tmp/p3-toolchain.txt

      - name: Build current source twice without tracked native artifacts
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TRACKING=1cf353b4f5c18afdfb4b3bc59e9fc966bc26538f
          build_once() {
            local root="$1"
            rm -rf "$root"
            mkdir -p "$root"
            git archive "$EXPECTED_TRACKING" rust-vexus-lite | tar -x -C "$root"
            find "$root/rust-vexus-lite" -maxdepth 1 -type f -name '*.node' -delete
            pushd "$root/rust-vexus-lite" >/dev/null
            CC=gcc-12 CXX=g++-12 RUSTUP_TOOLCHAIN=1.89.0 \
              /tmp/napi-cli/node_modules/.bin/napi build --platform --release --cargo-flags="--locked"
            test -f vexus-lite.linux-x64-gnu.node
            popd >/dev/null
          }

          build_once /tmp/vexus-build-1
          build_once /tmp/vexus-build-2

          B1=/tmp/vexus-build-1/rust-vexus-lite/vexus-lite.linux-x64-gnu.node
          B2=/tmp/vexus-build-2/rust-vexus-lite/vexus-lite.linux-x64-gnu.node
          SHA1="$(sha256sum "$B1" | awk '{print $1}')"
          SHA2="$(sha256sum "$B2" | awk '{print $1}')"
          test "$SHA1" = "$SHA2"
          cmp -s "$B1" "$B2"
          printf 'BUILD1_SHA256=%s\nBUILD2_SHA256=%s\nREPRODUCIBLE=PASS\n' "$SHA1" "$SHA2" | tee /tmp/p3-build.txt

      - name: Enforce GLIBC ceiling and current JS runtime contract
        shell: bash
        run: |
          set -euo pipefail
          B1=/tmp/vexus-build-1/rust-vexus-lite/vexus-lite.linux-x64-gnu.node
          MAX_ALLOWED=2.35
          MAX_OBSERVED="$(objdump -T "$B1" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)"
          test -n "$MAX_OBSERVED"
          test "$(printf '%s\n%s\n' "$MAX_OBSERVED" "$MAX_ALLOWED" | sort -V | tail -n 1)" = "$MAX_ALLOWED"
          printf 'MAX_ALLOWED_GLIBC=%s\nMAX_OBSERVED_GLIBC=%s\nGLIBC_GATE=PASS\n' "$MAX_ALLOWED" "$MAX_OBSERVED" | tee /tmp/p3-glibc.txt

          pushd /tmp/vexus-build-1/rust-vexus-lite >/dev/null
          node - <<'NODE' | tee /tmp/p3-current-api.txt
          const mod = require('./index.js');
          for (const name of ['NativeKnowledgeRuntime', 'VexusIndex', 'VexusWatcher']) {
            if (typeof mod[name] !== 'function') throw new Error(`missing current export: ${name}`);
          }
          console.log('CURRENT_LOADER_EXPORTS=PASS');
          NODE
          node test.js | tee /tmp/p3-vexus-smoke.txt
          rm -f test_index.usearch test_map.bin
          popd >/dev/null

      - name: Verify KnowledgeBaseManager loads against rebuilt native module
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund
          TRACKED_SHA="$(sha256sum rust-vexus-lite/vexus-lite.linux-x64-gnu.node | awk '{print $1}')"
          BUILT_SHA="$(sha256sum /tmp/vexus-build-1/rust-vexus-lite/vexus-lite.linux-x64-gnu.node | awk '{print $1}')"
          cp /tmp/vexus-build-1/rust-vexus-lite/vexus-lite.linux-x64-gnu.node rust-vexus-lite/vexus-lite.linux-x64-gnu.node
          SCRATCH="$(mktemp -d)"
          trap 'rm -rf "$SCRATCH"' EXIT
          KNOWLEDGEBASE_ROOT_PATH="$SCRATCH/diary" \
          KNOWLEDGEBASE_STORE_PATH="$SCRATCH/vector" \
          VECTORDB_DIMENSION=128 \
          node - <<'NODE' | tee /tmp/p3-kbd-load.txt
          const manager = require('./KnowledgeBaseManager.js');
          if (typeof manager.initialize !== 'function' || typeof manager.shutdown !== 'function') {
            throw new Error('KnowledgeBaseManager runtime surface missing');
          }
          console.log('KNOWLEDGEBASE_MANAGER_LOAD=PASS');
          NODE
          printf 'TRACKED_BINARY_SHA256=%s\nSOURCE_BUILD_SHA256=%s\n' "$TRACKED_SHA" "$BUILT_SHA" | tee /tmp/p3-binary-comparison.txt

      - name: Confirm no repository source mutation
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- rust-vexus-lite/vexus-lite.linux-x64-gnu.node
          test -z "$(git status --porcelain)"
          echo 'SOURCE_MUTATION=NONE' | tee /tmp/p3-clean.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-vexus-current-source-probe
          path: |
            /tmp/p3-source.txt
            /tmp/p3-toolchain.txt
            /tmp/p3-build.txt
            /tmp/p3-glibc.txt
            /tmp/p3-current-api.txt
            /tmp/p3-vexus-smoke.txt
            /tmp/p3-kbd-load.txt
            /tmp/p3-binary-comparison.txt
            /tmp/p3-clean.txt
