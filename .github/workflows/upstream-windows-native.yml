name: Upstream Windows native source build

on:
  pull_request:
    branches: [master]
    paths:
      - 'rust-vexus-lite/**'
      - 'Plugin/DailyNoteSearcher/**'
      - 'scripts/verify-daily-note-searcher-native.cjs'
      - 'scripts/check-native-delivery.cjs'
      - 'docs/native-delivery-30193c89.json'
      - 'docs/native-delivery-d9f61c0.json'
      - '.github/workflows/upstream-windows-native.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /rust-vexus-lite/
            /Plugin/DailyNoteSearcher/src/
            /Plugin/DailyNoteSearcher/DailyNoteSearcher.exe
            /Plugin/DailyNoteSearcher/DailyNoteSearcher-x86_64-pc-windows-msvc.exe
            /scripts/verify-daily-note-searcher-native.cjs
            /scripts/check-native-delivery.cjs
            /docs/native-delivery-30193c89.json
            /docs/native-delivery-d9f61c0.json
            !**/config.env
            !**/.env
            !**/.env.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      - name: Test and build locked DailyNoteSearcher source
        shell: pwsh
        run: |
          rustc --version --verbose
          node --version
          cargo test --locked --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'DailyNoteSearcher source tests failed' }
          cargo build --locked --release --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'DailyNoteSearcher build failed' }
          node scripts/verify-daily-note-searcher-native.cjs Plugin/DailyNoteSearcher/src/target/release/DailyNoteSearcher.exe
          if ($LASTEXITCODE -ne 0) { throw 'DailyNoteSearcher native regression failed' }
      - name: Build locked Vexus source and verify in-memory vectors
        shell: pwsh
        run: |
          # Cargo's Git file enumeration can fail on this sparse Windows tree.
          # Build only the checked-out source in a fresh non-Git directory.
          $buildRoot = Join-Path $env:RUNNER_TEMP 'vcp-native-source'
          New-Item -ItemType Directory -Path $buildRoot | Out-Null
          Copy-Item rust-vexus-lite (Join-Path $buildRoot 'rust-vexus-lite') -Recurse -Exclude '*.node', 'target'
          Set-Location (Join-Path $buildRoot 'rust-vexus-lite')
          npm exec --yes --package=@napi-rs/cli@2.18.4 -- napi build --platform --release --cargo-flags="--locked"
          if ($LASTEXITCODE -ne 0) { throw 'Vexus build failed' }
          node -e "const a=require('./vexus-lite.win32-x64-msvc.node'); const x=new a.VexusIndex(4,16); x.add(1,new Float32Array([1,0,0,0])); if(x.search(new Float32Array([1,0,0,0]),1)[0]?.id!==1) throw Error('Vexus smoke failed'); const m=JSON.parse(x.memoObservationMemoryStats()); if(m.entries!==0 || x.releaseMemoObservation('synthetic-missing')!==false) throw Error('Memo lifetime ABI failed');"
          if ($LASTEXITCODE -ne 0) { throw 'Vexus smoke failed' }
      - name: Record build identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native-output | Out-Null
          Copy-Item Plugin/DailyNoteSearcher/src/target/release/DailyNoteSearcher.exe native-output/
          Copy-Item "$env:RUNNER_TEMP/vcp-native-source/rust-vexus-lite/vexus-lite.win32-x64-msvc.node" native-output/
          $files = Get-ChildItem native-output -File | ForEach-Object {
            @{ name=$_.Name; sha256=(Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant() }
          }
          @{ source='${{ github.event.pull_request.head.sha }}'; rust='1.89.0'; node='22.23.1'; napi='2.18.4'; runner_image=$env:ImageOS; runner_image_version=$env:ImageVersion; files=@($files) } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 native-output/build-identity.json
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-windows-native-rebuilt
          path: native-output/*
          if-no-files-found: error
          retention-days: 1
      - name: Verify bundled artifacts and recorded source provenance
        shell: pwsh
        run: |
          node scripts/check-native-delivery.cjs x86_64-pc-windows-msvc vexus daily --receipt docs/native-delivery-d9f61c0.json
          if ($LASTEXITCODE -ne 0) { throw 'Bundled native provenance check failed' }
          node scripts/verify-daily-note-searcher-native.cjs Plugin/DailyNoteSearcher/DailyNoteSearcher-x86_64-pc-windows-msvc.exe
          if ($LASTEXITCODE -ne 0) { throw 'Bundled DailyNoteSearcher regression failed' }
          node -e "const a=require('./rust-vexus-lite/vexus-lite.win32-x64-msvc.node'); const x=new a.VexusIndex(4,16); x.add(1,new Float32Array([1,0,0,0])); if(x.search(new Float32Array([1,0,0,0]),1)[0]?.id!==1) throw Error('Bundled Vexus smoke failed'); const m=JSON.parse(x.memoObservationMemoryStats()); if(m.entries!==0 || x.releaseMemoObservation('synthetic-missing')!==false) throw Error('Bundled Memo lifetime ABI failed');"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Vexus smoke failed' }
