name: PR276 byte-preserving cleanup

on:
  push:
    branches:
      - codex/three-way-provider-seal-cache-compat-20260913
    paths:
      - .github/workflows/pr276_final_bounded.yml

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin validated repair
        shell: bash
        run: |
          set -euo pipefail
          expected=10ed922fc774ca70e692e1bb67653131cca8ae38
          git merge-base --is-ancestor "$expected" HEAD
          mapfile -t changed < <(git diff --name-only "$expected"..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/pr276_final_bounded.yml'

      - name: Restore original handler bytes and replay only nullable identity repair
        shell: bash
        run: |
          set -euo pipefail
          git show 29336add899777b030c2973a7e3ecb4e442ce11d:modules/chatCompletionHandler.js > /tmp/pr276-handler-original
          python3 - <<'PY'
          from pathlib import Path

          original = Path('/tmp/pr276-handler-original').read_bytes()
          data = original

          def replace_local(first, second, replacement_lines):
              global data
              if data.count(first) != 1:
                  raise SystemExit(f'first-line count is {data.count(first)} for {first!r}')
              pos = data.find(first) + len(first)
              if data[pos:pos+2] == b'\r\n':
                  nl = b'\r\n'
              elif data[pos:pos+1] == b'\n':
                  nl = b'\n'
              else:
                  raise SystemExit(f'no newline after {first!r}')
              old = first + nl + second
              if data.count(old) != 1:
                  raise SystemExit(f'two-line count is {data.count(old)} for {first!r}')
              new = nl.join(replacement_lines)
              data = data.replace(old, new, 1)

          replace_local(
              b"    && typeof value.externalKeyDigest === 'string'",
              b"    && /^[0-9a-f]{64}$/u.test(value.externalKeyDigest)",
              [
                  b"    && (value.externalKeyDigest === null",
                  b"      || (typeof value.externalKeyDigest === 'string'",
                  b"        && /^[0-9a-f]{64}$/u.test(value.externalKeyDigest)))",
              ],
          )
          replace_local(
              b"    && typeof value.frontendPlane === 'string'",
              b"    && /^[A-Z][A-Z0-9_]{0,63}$/u.test(value.frontendPlane)",
              [
                  b"    && (value.frontendPlane === null",
                  b"      || (typeof value.frontendPlane === 'string'",
                  b"        && /^[A-Z][A-Z0-9_]{0,63}$/u.test(value.frontendPlane)))",
              ],
          )
          replace_local(
              b"    && typeof value.frontendPrincipalDigest === 'string'",
              b"    && /^[0-9a-f]{64}$/u.test(value.frontendPrincipalDigest)",
              [
                  b"    && (value.frontendPrincipalDigest === null",
                  b"      || (typeof value.frontendPrincipalDigest === 'string'",
                  b"        && /^[0-9a-f]{64}$/u.test(value.frontendPrincipalDigest)))",
              ],
          )

          Path('modules/chatCompletionHandler.js').write_bytes(data)
          PY

      - name: Revalidate repaired contract
        shell: bash
        run: |
          set -euo pipefail
          node --check modules/chatCompletionHandler.js
          node --check Plugin/OneRing/OneRing.js
          node --check tests/residentProviderPresenceContract.test.cjs
          node --test tests/residentProviderPresenceContract.test.cjs
          node --test tests/directPluginRuntime.test.js
          read -r adds dels path < <(git diff --numstat 29336add899777b030c2973a7e3ecb4e442ce11d -- modules/chatCompletionHandler.js)
          echo "handler delta from reviewed head: +${adds}/-${dels} ${path}"
          test "$adds" -le 15
          test "$dels" -le 15

      - name: Commit byte-preserving cleanup
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'modules/chatCompletionHandler.js'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/chatCompletionHandler.js
          git commit -m 'fix(resident): preserve handler source bytes'
          git push origin HEAD:${GITHUB_REF_NAME}
