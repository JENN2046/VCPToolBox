name: PR276 final bounded repair

on:
  push:
    branches:
      - codex/three-way-provider-seal-cache-compat-20260913
    paths:
      - .github/workflows/pr276_final_bounded.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin repair input
        shell: bash
        run: |
          set -euo pipefail
          expected=29336add899777b030c2973a7e3ecb4e442ce11d
          test "$(git rev-parse HEAD^)" = "$expected"

      - name: Apply bounded OneRing and Host contract repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          handler_path = Path('modules/chatCompletionHandler.js')
          handler = handler_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "    && typeof value.externalKeyDigest === 'string'\n    && /^[0-9a-f]{64}$/u.test(value.externalKeyDigest)",
                  "    && (value.externalKeyDigest === null\n      || (typeof value.externalKeyDigest === 'string'\n        && /^[0-9a-f]{64}$/u.test(value.externalKeyDigest)))"
              ),
              (
                  "    && typeof value.frontendPlane === 'string'\n    && /^[A-Z][A-Z0-9_]{0,63}$/u.test(value.frontendPlane)",
                  "    && (value.frontendPlane === null\n      || (typeof value.frontendPlane === 'string'\n        && /^[A-Z][A-Z0-9_]{0,63}$/u.test(value.frontendPlane)))"
              ),
              (
                  "    && typeof value.frontendPrincipalDigest === 'string'\n    && /^[0-9a-f]{64}$/u.test(value.frontendPrincipalDigest)",
                  "    && (value.frontendPrincipalDigest === null\n      || (typeof value.frontendPrincipalDigest === 'string'\n        && /^[0-9a-f]{64}$/u.test(value.frontendPrincipalDigest)))"
              ),
          ]
          for old, new in replacements:
              count = handler.count(old)
              if count != 1:
                  raise SystemExit(f'handler replacement count {count} for {old!r}')
              handler = handler.replace(old, new, 1)
          handler_path.write_text(handler, encoding='utf-8')

          onering_path = Path('Plugin/OneRing/OneRing.js')
          onering = onering_path.read_text(encoding='utf-8')
          needle = """    return {\n      agentName,\n      frontendSource,\n      postTurn,\n      turnId: normalizeText(postTurn?.turnId) || null,\n      requestHash: normalizeText(postTurn?.requestHash) || null,\n    };"""
          replacement = """    return {\n      agentName,\n      externalKeyDigest: null,\n      frontendPlane: null,\n      frontendPrincipalDigest: null,\n      frontendSource,\n      postTurn,\n      turnId: normalizeText(postTurn?.turnId) || null,\n      requestHash: normalizeText(postTurn?.requestHash) || null,\n    };"""
          count = onering.count(needle)
          if count != 1:
              pos = onering.find('extractMetaFromMessages')
              print(onering[max(0, pos-400):pos+1600])
              raise SystemExit(f'OneRing extractMeta return replacement count {count}')
          onering = onering.replace(needle, replacement, 1)
          onering_path.write_text(onering, encoding='utf-8')
          PY

          cat > tests/residentProviderPresenceContract.test.cjs <<'EOF'
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const { createHash } = require('node:crypto');
          const test = require('node:test');

          const handler = fs.readFileSync('modules/chatCompletionHandler.js', 'utf8');
          const oneRing = fs.readFileSync('Plugin/OneRing/OneRing.js', 'utf8');
          const pluginManager = fs.readFileSync('Plugin.js', 'utf8');

          function loadPresenceValidators() {
            const start = handler.indexOf('function isPlainRecord(value)');
            const end = handler.indexOf('function parseBooleanEnv', start);
            assert.ok(start >= 0 && end > start, 'presence validator source slice must exist');
            const source = `${handler.slice(start, end)}\nthis.validators = { validOneRingPresenceMeta, sameOneRingPresenceMeta };`;
            const context = { Buffer, createHash };
            vm.runInNewContext(source, context, { filename: 'chatCompletionHandler.presence.validators.js' });
            return context.validators;
          }

          function meta(overrides = {}) {
            return {
              agentName: 'Nuobao',
              externalKeyDigest: null,
              frontendPlane: null,
              frontendPrincipalDigest: null,
              frontendSource: 'VCPChat',
              requestHash: '1'.repeat(64),
              turnId: 'turn:r1:test',
              ...overrides
            };
          }

          test('OneRing explicitly projects unknown authority metadata as null', () => {
            const marker = 'function extractMetaFromMessages(messages)';
            const start = oneRing.indexOf(marker);
            assert.ok(start >= 0, 'extractMetaFromMessages must exist');
            const next = oneRing.indexOf('async function recordAIResponseFromMessages', start);
            const body = oneRing.slice(start, next > start ? next : start + 2400);
            assert.match(body, /externalKeyDigest:\s*null/);
            assert.match(body, /frontendPlane:\s*null/);
            assert.match(body, /frontendPrincipalDigest:\s*null/);
            assert.doesNotMatch(body, /createHash|sha256|digest/i,
              'OneRing must not fabricate authority metadata from labels');
          });

          test('Host admits honest UNKNOWN OneRing authority metadata for Resident evaluation', () => {
            const { validOneRingPresenceMeta } = loadPresenceValidators();
            assert.equal(validOneRingPresenceMeta(meta()), true);
          });

          test('Host still admits exact non-null authority metadata when a trusted producer exists', () => {
            const { validOneRingPresenceMeta } = loadPresenceValidators();
            assert.equal(validOneRingPresenceMeta(meta({
              externalKeyDigest: 'a'.repeat(64),
              frontendPlane: 'VCPCHAT',
              frontendPrincipalDigest: 'b'.repeat(64)
            })), true);
          });

          test('Host rejects malformed non-null authority metadata', () => {
            const { validOneRingPresenceMeta } = loadPresenceValidators();
            assert.equal(validOneRingPresenceMeta(meta({ externalKeyDigest: 'not-a-digest' })), false);
            assert.equal(validOneRingPresenceMeta(meta({ frontendPlane: 'vcpchat' })), false);
            assert.equal(validOneRingPresenceMeta(meta({ frontendPrincipalDigest: 'xyz' })), false);
          });

          test('OneRing metadata equality treats UNKNOWN as a real stable contract value', () => {
            const { sameOneRingPresenceMeta } = loadPresenceValidators();
            assert.equal(sameOneRingPresenceMeta(meta(), meta()), true);
            assert.equal(sameOneRingPresenceMeta(meta(), meta({ requestHash: '2'.repeat(64) })), false);
            assert.equal(sameOneRingPresenceMeta(meta(), meta({ externalKeyDigest: 'a'.repeat(64) })), false);
          });

          test('Host passes OneRing authority fields through without synthesizing identity', () => {
            assert.match(handler, /externalKeyDigest:\s*presenceOneRingMeta\.externalKeyDigest/);
            assert.match(handler, /frontendPlane:\s*presenceOneRingMeta\.frontendPlane/);
            assert.match(handler, /frontendPrincipalDigest:\s*presenceOneRingMeta\.frontendPrincipalDigest/);
          });

          test('Resident remains an explicit external composition dependency', () => {
            assert.match(pluginManager, /VCP_PLUGIN_DIRS/);
            assert.match(pluginManager, /VCP_EXTERNAL_PLUGIN_ALLOWLIST/);
            assert.match(handler, /messagePreprocessors\s*\.get\('AGENTSOSResident'\)/);
            assert.match(handler, /!residentModule[\s\S]{0,180}typeof residentModule\.processMessages !== 'function'/);
            assert.match(handler, /Object\.getOwnPropertyDescriptor\([\s\S]{0,160}residentPresenceModule[\s\S]{0,160}'sealProviderAttempt'/);
          });

          test('Presence-bound path keeps replay-cache bypass and provider-seal gating', () => {
            assert.match(handler, /!residentPresenceRequested[\s\S]{0,120}responseCacheKey[\s\S]{0,120}responseReplayCache\.replay/);
            assert.match(handler, /residentPresenceRequested[\s\S]{0,120}__vcpDisableReplayCache/);
            assert.match(handler, /await Promise\.race\(/);
            assert.match(handler, /sealProviderAttempt/);
            assert.match(handler, /RESIDENT_PROVIDER_ATTEMPT_DENIED/);
          });
          EOF

      - name: Syntax and focused contract validation
        shell: bash
        run: |
          set -euo pipefail
          node --check modules/chatCompletionHandler.js
          node --check Plugin/OneRing/OneRing.js
          node --check tests/residentProviderPresenceContract.test.cjs
          node --test tests/residentProviderPresenceContract.test.cjs

      - name: Verify bounded diff and commit repair
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = 'Plugin/OneRing/OneRing.js'
          test "${changed[1]}" = 'modules/chatCompletionHandler.js'
          test "${changed[2]}" = 'tests/residentProviderPresenceContract.test.cjs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Plugin/OneRing/OneRing.js modules/chatCompletionHandler.js tests/residentProviderPresenceContract.test.cjs
          git commit -m 'fix(resident): preserve unknown OneRing authority metadata'
          git push origin HEAD:${GITHUB_REF_NAME}
