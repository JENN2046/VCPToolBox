name: Gen-USearch G1 Gen0

on:
  push:
    branches:
      - codex/gen-usearch-g1-production
    paths:
      - 'Plugin/DailyNoteSearcher/**'
      - 'contracts/gen-usearch/g1/**'
      - '.github/workflows/gen-usearch-g1-gen0.yml'
  pull_request:
    paths:
      - 'Plugin/DailyNoteSearcher/**'
      - 'contracts/gen-usearch/g1/**'
      - '.github/workflows/gen-usearch-g1-gen0.yml'

permissions:
  contents: read

jobs:
  g1b-rust:
    name: g1b-rust-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Validate locked dependency graph
        run: cargo metadata --locked --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml --no-deps

      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --locked --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml --all-targets -- -D warnings

      - name: Build service
        run: cargo build --locked --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml

  g1b-service-smoke:
    runs-on: ubuntu-latest
    needs: g1b-rust
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bridge, manifest, and contract
        run: |
          node --check Plugin/DailyNoteSearcher/DailyNoteSearcher.js
          python3 -m json.tool Plugin/DailyNoteSearcher/plugin-manifest.json >/dev/null
          python3 -m json.tool contracts/gen-usearch/g1/g1-b-contract.json >/dev/null

      - name: Build service binary
        run: cargo build --locked --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml

      - name: G1-B service lifecycle smoke
        run: |
          python3 Plugin/DailyNoteSearcher/tests/gen_usearch_g1b_smoke.py \
            Plugin/DailyNoteSearcher/src/target/debug/DailyNoteSearcher
