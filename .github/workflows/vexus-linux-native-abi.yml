name: Vexus Linux Native ABI

on:
  push:
    branches:
      - integration/p3-vexus-native-abi-candidate
      - integration/upstream-tracking-rebaseline-r1
    paths:
      - .github/workflows/vexus-linux-native-abi.yml
      - KnowledgeBaseManager.js
      - package.json
      - package-lock.json
      - rust-vexus-lite/**
      - scripts/check-vexus-linux-native-abi.js
  pull_request:
    paths:
      - .github/workflows/vexus-linux-native-abi.yml
      - KnowledgeBaseManager.js
      - package.json
      - package-lock.json
      - rust-vexus-lite/**
      - scripts/check-vexus-linux-native-abi.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64-gnu:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Install pinned native build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-12 g++-12 binutils
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          npm install --prefix /tmp/napi-cli --ignore-scripts --no-audit --no-fund @napi-rs/cli@2.18.4
          rustc --version
          cargo --version
          node --version
          node -p "'@napi-rs/cli ' + require('/tmp/napi-cli/node_modules/@napi-rs/cli/package.json').version"
          gcc-12 --version | sed -n '1p'
          ldd --version | sed -n '1p'

      - name: Install runtime dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Rebuild Linux x64 GNU artifact twice from current source
        shell: bash
        run: |
          set -euo pipefail
          build_once() {
            local root="$1"
            rm -rf "$root"
            mkdir -p "$root"
            cp -a rust-vexus-lite "$root/rust-vexus-lite"
            find "$root/rust-vexus-lite" -maxdepth 1 -type f -name '*.node' -delete
            rm -rf "$root/rust-vexus-lite/target"
            pushd "$root/rust-vexus-lite" >/dev/null
            CC=gcc-12 CXX=g++-12 RUSTUP_TOOLCHAIN=1.89.0 \
              /tmp/napi-cli/node_modules/.bin/napi build --platform --release --cargo-flags="--locked"
            test -f vexus-lite.linux-x64-gnu.node
            popd >/dev/null
          }

          build_once /tmp/vexus-abi-build-1
          build_once /tmp/vexus-abi-build-2

          B1=/tmp/vexus-abi-build-1/rust-vexus-lite/vexus-lite.linux-x64-gnu.node
          B2=/tmp/vexus-abi-build-2/rust-vexus-lite/vexus-lite.linux-x64-gnu.node
          TRACKED=rust-vexus-lite/vexus-lite.linux-x64-gnu.node
          SHA1="$(sha256sum "$B1" | awk '{print $1}')"
          SHA2="$(sha256sum "$B2" | awk '{print $1}')"
          TRACKED_SHA="$(sha256sum "$TRACKED" | awk '{print $1}')"

          test "$SHA1" = "$SHA2"
          cmp -s "$B1" "$B2"
          test "$SHA1" = "$TRACKED_SHA"

          printf 'SOURCE_BUILD_SHA256=%s\nTRACKED_BINARY_SHA256=%s\nREPRODUCIBLE=PASS\nSOURCE_ARTIFACT_MATCH=PASS\n' \
            "$SHA1" "$TRACKED_SHA"

      - name: Enforce GLIBC ceiling and current runtime contract
        env:
          MAX_ALLOWED_GLIBC: '2.35'
        run: node scripts/check-vexus-linux-native-abi.js
