name: Vexus Linux Native ABI

on:
  pull_request:
    branches:
      - integration/clean-upstream-main
    paths:
      - .github/workflows/vexus-linux-native-abi.yml
      - KnowledgeBaseManager.js
      - rust-vexus-lite/**
      - scripts/check-vexus-linux-native-abi.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64-gnu:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install ABI inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils

      - name: Install runtime dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --omit=dev

      - name: Enforce Linux x64 GNU compatibility and runtime contract
        env:
          MAX_ALLOWED_GLIBC: '2.35'
        run: node scripts/check-vexus-linux-native-abi.js
