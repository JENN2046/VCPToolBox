name: P2 current-host candidate validation

on:
  push:
    branches:
      - integration/p2-external-composition-merge-probe

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build bounded P2 candidate on exact P1 head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_P1=ed6d8565a04bd7767a24fe3fd1020df1a144de93
          P2_BASE=f901f1a995fa6f8242e176b8ca66b6addd0be427
          P2_HEAD=a4225acaafd0cf6019c843d65f374b499febe165
          cp .github/rebaseline/p2-current-host-adaptation.patch.b64 /tmp/p2-adapt.b64
          cp .github/rebaseline/p2-p1-cross-assert.js /tmp/p1-p2-cross.js
          base64 -d /tmp/p2-adapt.b64 > /tmp/p2-adapt.patch

          git fetch origin integration/upstream-tracking-rebaseline-r1 codex/upstream-main-clean-base codex/phase1-clean-core-plugin-contract
          ACTUAL_P1="$(git rev-parse origin/integration/upstream-tracking-rebaseline-r1)"
          test "$ACTUAL_P1" = "$EXPECTED_P1"
          git checkout --detach "$ACTUAL_P1"

          SUPPORT_PATHS=(
            modules/externalPluginAllowPolicy.js
            modules/externalPluginSafetyGate.js
            modules/pluginRootResolver.js
            modules/pluginRuntimeEnvSandbox.js
            tests/externalPluginAllowPolicy.test.js
            tests/externalPluginSafetyGate.test.js
            tests/plugin-external-dirs.test.js
            tests/plugin-external-runtime-direct-policy.test.js
            tests/plugin-external-runtime-env-sandbox.test.js
            tests/plugin-external-runtime-registration-gate.test.js
          )
          git diff "$P2_BASE" "$P2_HEAD" -- "${SUPPORT_PATHS[@]}" > /tmp/p2-support.patch
          git apply /tmp/p2-support.patch

          git diff "$P2_BASE" "$P2_HEAD" -- Plugin.js > /tmp/p2-plugin.patch
          git apply --reject --ignore-space-change /tmp/p2-plugin.patch || true
          git apply --ignore-space-change /tmp/p2-adapt.patch
          rm -f Plugin.js.rej
          chmod 0644 Plugin.js

          git add -N "${SUPPORT_PATHS[@]}"
          node --check Plugin.js
          node --check modules/externalPluginAllowPolicy.js
          node --check modules/externalPluginSafetyGate.js
          node --check modules/pluginRootResolver.js
          node --check modules/pluginRuntimeEnvSandbox.js
          git diff --check

          EXPECTED_FILES="$(printf '%s\n' Plugin.js "${SUPPORT_PATHS[@]}" | sort)"
          ACTUAL_FILES="$(git diff --name-only | sort)"
          test "$ACTUAL_FILES" = "$EXPECTED_FILES"
          git diff --stat
          git diff --numstat
          git diff > /tmp/p2-current-host-candidate.diff

      - name: Run P2 targeted suite
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/externalPluginAllowPolicy.test.js \
            tests/externalPluginSafetyGate.test.js \
            tests/plugin-external-dirs.test.js \
            tests/plugin-external-runtime-direct-policy.test.js \
            tests/plugin-external-runtime-env-sandbox.test.js \
            tests/plugin-external-runtime-registration-gate.test.js | tee /tmp/p2-tests.txt

      - name: Run P1 regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/vcpToolBridgeNativeManifest.test.js | tee /tmp/p1-regression.txt

      - name: Assert P1 x P2 authority and provenance composition
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/p1-p2-cross.js | tee /tmp/p1-p2-cross.txt

      - name: Capture candidate evidence
        if: always()
        shell: bash
        run: |
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "FILES:"
            git diff --name-only || true
            echo "STAT:"
            git diff --stat || true
            echo "NUMSTAT:"
            git diff --numstat || true
          } > /tmp/summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-current-host-candidate-validation
          path: |
            /tmp/p2-current-host-candidate.diff
            /tmp/p2-tests.txt
            /tmp/p1-regression.txt
            /tmp/p1-p2-cross.txt
            /tmp/summary.txt
