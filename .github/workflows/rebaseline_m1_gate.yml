name: VCPToolBox Rebaseline M1 Gate

on:
  push:
    branches:
      - integration/vcptoolbox-upstream-rebaseline-r1-m1
    paths:
      - .github/workflows/rebaseline_m1_gate.yml

permissions:
  contents: read

jobs:
  m1-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout clean M1 lane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact upstream ancestry and bounded M1 diff
        shell: bash
        run: |
          set -euo pipefail
          upstream=9deadda698eb87b4ee2aef5c27ea7c01e8970a02
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"

          mapfile -t changed < <(git diff --name-only "$upstream"..HEAD | sort)
          printf 'M1 changed paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = '.github/workflows/rebaseline_m1_gate.yml'
          test "${changed[1]}" = 'docs/rebaseline/VCPTOOLBOX_UPSTREAM_TRACKING_REBASELINE_R1.md'
          test "${changed[2]}" = 'docs/rebaseline/vcptoolbox-upstream-tracking-rebaseline-r1.matrix.json'
          test "${changed[3]}" = 'tests/rebaselineMigrationMatrix.test.cjs'

          # M1 is governance + acceptance only. No product/runtime path may change.
          if git diff --name-only "$upstream"..HEAD | grep -Ev '^(\.github/workflows/rebaseline_m1_gate\.yml|docs/rebaseline/|tests/rebaselineMigrationMatrix\.test\.cjs)$'; then
            echo 'Unexpected product/runtime path in M1 diff' >&2
            exit 1
          fi

      - name: Validate frozen matrix harness
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/rebaselineMigrationMatrix.test.cjs
          node --test tests/rebaselineMigrationMatrix.test.cjs
