name: CodeSearcher Linux source verification

on:
  pull_request:
    paths:
      - 'Plugin/CodeSearcher/**'
      - 'scripts/verify-code-searcher-native.cjs'
      - 'tests/codeSearcherBridge.test.js'
      - '.github/workflows/codesearcher-linux-arm64.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            libc: gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            libc: musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            libc: gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            libc: musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}
      - name: Test locked source
        run: cargo test --locked --manifest-path Plugin/CodeSearcher/src/Cargo.toml
      - name: Build locked source twice and compare
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.libc }}' = musl ]; then
            host="$(rustc -vV | sed -n 's/^host: //p')"
            export RUSTFLAGS="-C linker=$(rustc --print sysroot)/lib/rustlib/$host/bin/rust-lld"
          fi
          for build in first second; do
            CARGO_TARGET_DIR="$RUNNER_TEMP/codesearcher-$build" cargo build --locked --release --target '${{ matrix.target }}' --manifest-path Plugin/CodeSearcher/src/Cargo.toml
          done
          cmp "$RUNNER_TEMP/codesearcher-first/${{ matrix.target }}/release/CodeSearcher" "$RUNNER_TEMP/codesearcher-second/${{ matrix.target }}/release/CodeSearcher"
      - name: Run isolated native regression
        run: node scripts/verify-code-searcher-native.cjs "$RUNNER_TEMP/codesearcher-first/${{ matrix.target }}/release/CodeSearcher"
      - name: Verify static musl executable in the official Alpine runtime
        if: matrix.libc == 'musl'
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/src:ro" -v "$RUNNER_TEMP/codesearcher-first:/built:ro" -w /src node:20-alpine node scripts/verify-code-searcher-native.cjs "/built/${{ matrix.target }}/release/CodeSearcher"
      - name: Preserve rebuilt artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: codesearcher-${{ matrix.target }}-rebuilt
          path: ${{ runner.temp }}/codesearcher-first/${{ matrix.target }}/release/CodeSearcher
          if-no-files-found: error
          retention-days: 1
      - name: Verify Linux bridge selection
        run: node --test tests/codeSearcherBridge.test.js
      - name: Compare bundled executable with locked-source rebuild
        run: |
          cmp 'Plugin/CodeSearcher/CodeSearcher-${{ matrix.target }}' "$RUNNER_TEMP/codesearcher-first/${{ matrix.target }}/release/CodeSearcher"
          sha256sum 'Plugin/CodeSearcher/CodeSearcher-${{ matrix.target }}'
