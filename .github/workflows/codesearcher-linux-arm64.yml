name: CodeSearcher Linux ARM64 source build

on:
  pull_request:
    paths:
      - 'Plugin/CodeSearcher/**'
      - '.github/workflows/codesearcher-linux-arm64.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      - name: Test locked source
        run: cargo test --locked --manifest-path Plugin/CodeSearcher/src/Cargo.toml
      - name: Build locked source
        run: cargo build --locked --release --manifest-path Plugin/CodeSearcher/src/Cargo.toml
      - name: Positive and traversal-rejection smoke
        shell: bash
        run: |
          set -euo pipefail
          binary=Plugin/CodeSearcher/src/target/release/CodeSearcher
          positive="$(printf '%s\n' '{"query":"HARD_MAX_RESULTS","search_path":"Plugin/CodeSearcher/src/src/main.rs","max_results":1}' | "$binary")"
          grep -q HARD_MAX_RESULTS <<< "$positive"
          blocked="$(printf '%s\n' '{"query":"HARD_MAX_RESULTS","search_path":"../"}' | "$binary")"
          grep -q '"status":"error"' <<< "$blocked"
      - name: Preserve rebuilt ARM64 artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: codesearcher-linux-arm64-rebuilt
          path: Plugin/CodeSearcher/src/target/release/CodeSearcher
          if-no-files-found: error
          retention-days: 1
