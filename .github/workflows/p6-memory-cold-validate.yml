name: P6 Memory cold compatibility validation

on:
  push:
    branches:
      - integration/p6-memory-cold-probe
    paths:
      - .github/workflows/p6-memory-cold-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 2f8fd1ff6c20de21a5fd2ca1b9c6580b92b13154

      - name: Guard exact P6 ancestry and bounded surface
        shell: bash
        run: |
          set -euo pipefail
          BASE=33dcb35b7ad6911c6844caf385b83de8ac9b37f2
          CANDIDATE=2f8fd1ff6c20de21a5fd2ca1b9c6580b92b13154
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          EXPECTED="$(printf '%s\n' \
            Plugin/LightMemo/LightMemoCompat.js \
            Plugin/LightMemo/plugin-manifest.json \
            modules/lightMemoCompatibility.js \
            tests/lightMemoCompatibility.test.cjs | sort)"
          ACTUAL="$(git diff --name-only "$BASE" "$CANDIDATE" | sort)"
          test "$ACTUAL" = "$EXPECTED"
          ! git diff --summary "$BASE" "$CANDIDATE" | grep -E 'mode change|rename|delete mode'
          git diff --check "$BASE" "$CANDIDATE"
          test "$(git rev-parse "$CANDIDATE:Plugin/LightMemo/LightMemo.js")" = dbcd93f13572c617185c021477eda5f985993ab5
          test "$(git rev-parse "$CANDIDATE:TDBKnowledge.js")" = 9c5d10114400c7f43973d920627fdc8e8b183ec9
          test "$(git rev-parse "$CANDIDATE:modules/lightMemoCompatibility.js")" = b32e002ea5f40a19ac63c9a827a883fa2fc4b475
          test "$(git rev-parse "$CANDIDATE:Plugin/LightMemo/LightMemoCompat.js")" = 5f58f37c5eef94c7546ede5ba50924d875822ff9
          test "$(git rev-parse "$CANDIDATE:Plugin/LightMemo/plugin-manifest.json")" = 82ec6dcce87241b983ef80ae6e9e7bd3f6220b6a
          test "$(git rev-parse "$CANDIDATE:tests/lightMemoCompatibility.test.cjs")" = 08d21bad7b6e7a604989319306158ac791aa5a6a
          ! git diff --name-only "$BASE" "$CANDIDATE" | grep -E '(^|/)tdbRecovery(/|$)'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Install runtime dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check modules/lightMemoCompatibility.js
          node --check Plugin/LightMemo/LightMemoCompat.js
          node --check tests/lightMemoCompatibility.test.cjs
          node -e "JSON.parse(require('node:fs').readFileSync('Plugin/LightMemo/plugin-manifest.json','utf8'))"

      - name: P6 wrapper composition contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('Plugin/LightMemo/plugin-manifest.json', 'utf8'));
          const wrapper = fs.readFileSync('Plugin/LightMemo/LightMemoCompat.js', 'utf8');
          assert.equal(manifest.entryPoint.script, 'LightMemoCompat.js');
          assert.match(wrapper, /require\('\.\/LightMemo\.js'\)/u);
          assert.match(wrapper, /require\('\.\.\/\.\.\/modules\/lightMemoCompatibility\.js'\)/u);
          assert.match(wrapper, /applyLightMemoCompatibility\(lightMemo\)/u);
          NODE

      - name: P6 LightMemo compatibility seam
        run: node --test tests/lightMemoCompatibility.test.cjs

      - name: P5 human authorization regression
        run: node --test tests/humanAuthorizationKernel.test.cjs

      - name: P4 Resident host regression
        run: node --test tests/residentHostContract.test.cjs tests/residentProviderPresenceContract.test.cjs

      - name: P2 external composition regression
        run: >-
          node --test
          tests/externalPluginAllowPolicy.test.js
          tests/externalPluginSafetyGate.test.js
          tests/plugin-external-dirs.test.js
          tests/plugin-external-runtime-direct-policy.test.js
          tests/plugin-external-runtime-env-sandbox.test.js
          tests/plugin-external-runtime-registration-gate.test.js

      - name: P1 Native Manifest regression
        run: node --test tests/vcpToolBridgeNativeManifest.test.js
