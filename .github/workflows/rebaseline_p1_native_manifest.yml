name: VCPToolBox rebaseline P1 native manifest

on:
  push:
    branches:
      - codex/vcptoolbox-rebaseline-p1-native-manifest
    paths:
      - .github/workflows/rebaseline_p1_native_manifest.yml

permissions:
  contents: write

jobs:
  replay-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact P1 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin clean upstream baseline
        shell: bash
        run: |
          set -euo pipefail
          upstream=9deadda698eb87b4ee2aef5c27ea7c01e8970a02
          git merge-base --is-ancestor "$upstream" HEAD
          mapfile -t delta < <(git diff --name-only "$upstream"..HEAD)
          test "${#delta[@]}" -eq 1
          test "${delta[0]}" = '.github/workflows/rebaseline_p1_native_manifest.yml'

      - name: Replay accepted FMS producer semantically
        shell: bash
        run: |
          set -euo pipefail
          old=2f5a64d87ba028fb01a0548c859c632be6416bd7
          if ! git cherry-pick --no-commit "$old"; then
            echo 'P1_REPLAY_CONFLICTS_BEGIN'
            git diff --name-only --diff-filter=U || true
            echo 'P1_REPLAY_CONFLICTS_END'
            git cherry-pick --abort || true
            exit 1
          fi
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'P1 changed files after replay:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 5
          test "${changed[0]}" = 'Plugin.js'
          test "${changed[1]}" = 'Plugin/VCPToolBridge/index.js'
          test "${changed[2]}" = 'WebSocketServer.js'
          test "${changed[3]}" = 'modules/nativeManifestAuthority.js'
          test "${changed[4]}" = 'tests/vcpToolBridgeNativeManifest.test.js'

      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail
          node --check Plugin.js
          node --check Plugin/VCPToolBridge/index.js
          node --check WebSocketServer.js
          node --check modules/nativeManifestAuthority.js
          node --check tests/vcpToolBridgeNativeManifest.test.js

      - name: Native manifest contract suite
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/vcpToolBridgeNativeManifest.test.js

      - name: Current-upstream adjacent regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            tests/vcpToolBridgeLifecycle.test.js \
            tests/dynamicToolRegistry.test.js \
            tests/webSocketHeartbeat.test.js; do
            if test -f "$f"; then
              echo "Running $f"
              node --test "$f"
            fi
          done

      - name: Commit P1 candidate only after validation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Plugin.js Plugin/VCPToolBridge/index.js WebSocketServer.js modules/nativeManifestAuthority.js tests/vcpToolBridgeNativeManifest.test.js
          git commit -m 'feat(manifest): restore native-v1 authority surface on clean upstream'
          git push origin HEAD:${GITHUB_REF_NAME}
