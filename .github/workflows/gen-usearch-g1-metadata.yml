name: Gen-USearch G1 Metadata

on:
  push:
    branches:
      - codex/gen-usearch-g1-production
    paths:
      - 'Plugin/DailyNoteSearcher/**'
      - 'contracts/gen-usearch/g1/**'
      - '.github/workflows/gen-usearch-g1-metadata.yml'
  pull_request:
    paths:
      - 'Plugin/DailyNoteSearcher/**'
      - 'contracts/gen-usearch/g1/**'
      - '.github/workflows/gen-usearch-g1-metadata.yml'

permissions:
  contents: read

jobs:
  g1a-metadata-substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          node --version
          python3 --version

      - name: Validate bridge and manifest
        run: |
          node --check Plugin/DailyNoteSearcher/DailyNoteSearcher.js
          python3 -m json.tool Plugin/DailyNoteSearcher/plugin-manifest.json >/dev/null
          python3 -m json.tool contracts/gen-usearch/g1/g1-a-contract.json >/dev/null

      - name: Rust format gate
        run: cargo fmt --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --locked --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml --all-targets -- -D warnings

      - name: Build service binary
        run: cargo build --locked --manifest-path Plugin/DailyNoteSearcher/src/Cargo.toml

      - name: G1-A service lifecycle smoke
        run: |
          python3 Plugin/DailyNoteSearcher/tests/gen_usearch_g1a_smoke.py \
            Plugin/DailyNoteSearcher/src/target/debug/DailyNoteSearcher
