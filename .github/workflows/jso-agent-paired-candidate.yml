name: JSO native host candidate

on:
  pull_request:
  push:
    branches: [codex/native-host-alignment]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jso-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired:
    uses: JENN2046/VCPToolBox-JENN-Extensions/.github/workflows/jso-agent-paired.yml@a6c7d447ddaa29799c60aa109d5119b102d1eae4
    with:
      harness_sha: a6c7d447ddaa29799c60aa109d5119b102d1eae4
      mode: candidate
      candidate_component: vcptoolbox
      candidate_repository: JENN2046/VCPToolBox
      candidate_sha: ${{ github.event.pull_request.head.sha || github.sha }}
  existing-host-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: node --test tests/distributedToolCancellation.test.js tests/approvalFeedbackPassthrough.test.js tests/toolApprovalManager.test.js
