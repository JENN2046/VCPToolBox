name: CodeSearcher Windows source verification

on:
  pull_request:
    paths:
      - 'Plugin/CodeSearcher/**'
      - 'modules/toolApprovalManager.js'
      - 'tests/toolApprovalPathSafety.test.cjs'
      - 'scripts/verify-code-searcher-native.cjs'
      - '.github/workflows/codesearcher-windows.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated approval path safety
        run: node --test tests/toolApprovalPathSafety.test.cjs
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      - name: Record compiler and test locked source
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo test --locked --manifest-path Plugin/CodeSearcher/src/Cargo.toml
      - name: Build locked source
        shell: pwsh
        run: cargo build --locked --release --manifest-path Plugin/CodeSearcher/src/Cargo.toml
      - name: Run isolated native regression
        shell: pwsh
        run: node scripts/verify-code-searcher-native.cjs Plugin/CodeSearcher/src/target/release/CodeSearcher.exe
      - name: Preserve rebuilt artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: codesearcher-windows-rebuilt
          path: Plugin/CodeSearcher/src/target/release/CodeSearcher.exe
          if-no-files-found: error
          retention-days: 1
      - name: Compare bundled executable and smoke test
        shell: pwsh
        run: |
          $rebuilt = 'Plugin/CodeSearcher/src/target/release/CodeSearcher.exe'
          $bundled = 'Plugin/CodeSearcher/CodeSearcher-x86_64-pc-windows-msvc.exe'
          $rebuiltHash = (Get-FileHash -Algorithm SHA256 $rebuilt).Hash.ToLowerInvariant()
          $bundledHash = (Get-FileHash -Algorithm SHA256 $bundled).Hash.ToLowerInvariant()
          Write-Output "rebuilt SHA256: $rebuiltHash"
          Write-Output "bundled SHA256: $bundledHash"
          node .github/scripts/verify-windows-pe.cjs $bundled $rebuilt
          if ($LASTEXITCODE -ne 0) {
            throw 'Bundled CodeSearcher code differs from the locked-source Windows rebuild.'
          }
          $ok = '{"query":"fn main","search_path":"Plugin/CodeSearcher/src/src/main.rs","max_results":1}' | & $rebuilt | ConvertFrom-Json
          if (-not $ok.result.content[0].text.Contains('fn main')) {
            throw 'CodeSearcher positive smoke failed.'
          }
          $blocked = '{"query":"fn main","search_path":"../"}' | & $rebuilt | ConvertFrom-Json
          if ($blocked.status -ne 'error' -or -not $blocked.error.Contains('search_path')) {
            throw 'CodeSearcher path traversal rejection smoke failed.'
          }
