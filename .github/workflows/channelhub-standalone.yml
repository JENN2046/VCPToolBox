name: ChannelHub Standalone

on:
  push:
    branches:
      - codex/channelhub-standalone-plugin
      - codex/channelhub-qqpersonal-ws
    paths:
      - 'Plugin/ChannelHub/**'
      - 'Plugin/vcp-*-adapter/channelhub-adapter.json'
      - 'Plugin/vcp-*-adapter/src/adapter/contract.js'
      - 'Plugin/vcp-onebot-adapter/**'
      - 'tests/channelHub*.test.js'
      - 'server.js'
      - '.github/workflows/channelhub-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install existing host dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: ChannelHub contract and integration tests
        run: npm run test:channelhub
      - name: OneBot adapter regression
        run: node --test Plugin/vcp-onebot-adapter/test/onebot-adapter.test.js
      - name: NativeSync regression
        run: NODE_PATH="$PWD/node_modules" npm run test:native-sync
      - name: Build standalone ZIP
        shell: bash
        run: |
          mkdir -p dist
          cd Plugin
          zip -q -r ../dist/ChannelHub-v0.4.0.zip ChannelHub \
            -x 'ChannelHub/config.env' 'ChannelHub/state/*' 'ChannelHub/node_modules/*'
          unzip -l ../dist/ChannelHub-v0.4.0.zip | grep 'ChannelHub/plugin-manifest.json'
          zip -q -r ../dist/QQPersonal-OneBot-v1.1.0.zip vcp-onebot-adapter \
            -x 'vcp-onebot-adapter/.env' 'vcp-onebot-adapter/node_modules/*' 'vcp-onebot-adapter/state/*'
          unzip -l ../dist/QQPersonal-OneBot-v1.1.0.zip | grep 'vcp-onebot-adapter/channelhub-adapter.json'
      - name: Publish installable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChannelHub-standalone
          path: dist/ChannelHub-v0.4.0.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish QQPersonal adapter artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQPersonal-OneBot-WS
          path: dist/QQPersonal-OneBot-v1.1.0.zip
          if-no-files-found: error
          retention-days: 14
